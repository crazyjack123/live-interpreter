<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Personal Interpreter</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: -apple-system, Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.card {
  max-width: 480px;
  margin: 15px auto;
  background: white;
  padding: 24px;
  border-radius: 22px;
  box-shadow: 0 4px 20px #0000000d;
}

.flags { font-size: 36px; }

button, input {
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  font-size: 16px;
  border-radius: 12px;
}

button {
  border: none;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

button:disabled { opacity: 0.4; }

.start { background: #15803d; }
.stop { background: #dc2626; }
.play { background: #2563eb; }

input { border: 1px solid #cbd5e1; }

#status {
  background: #f1f5f9;
  padding: 15px;
  margin: 15px 0;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

#meter {
  background: #e2e8f0;
  height: 14px;
  border-radius: 20px;
  overflow: hidden;
}

#level {
  background: #22c55e;
  height: 100%;
  width: 0%;
  transition: width 0.1s;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin: 24px 0;
}

.stats strong {
  font-size: 26px;
  display: block;
}

#transcript {
  text-align: left;
  white-space: pre-wrap;
  line-height: 1.6;
  max-height: 250px;
  overflow-y: auto;
}

small { color: #64748b; }

</style>
</head>

<body>

<div class="card">

  <h1>Personal Interpreter</h1>

  <div class="flags">🇵🇱 → 🇬🇧</div>

  <p>Live Polish to English Translation</p>

  <input id="token"
         type="password"
         autocomplete="off"
         autocapitalize="none"
         spellcheck="false"
         placeholder="Paste temporary access token">

  <button id="start"
          class="start"
          onclick="startTranslation()">
    Start live translation
  </button>

  <button id="stop"
          class="stop"
          onclick="stopTranslation()"
          disabled>
    Stop translation
  </button>

  <div id="status">Ready to interpret</div>

  <p id="micName">No microphone connected</p>

  <div id="meter">
    <div id="level"></div>
  </div>

  <div class="stats">
    <div>
      <small>Session time</small>
      <strong id="duration">00:00</strong>
    </div>
    <div>
      <small>Estimated cost</small>
      <strong id="cost">$0.00</strong>
    </div>
  </div>

  <audio id="audio" autoplay playsinline></audio>

  <button id="play"
          class="play"
          onclick="enableAudio()"
          hidden>
    Enable headphone audio
  </button>

  <small>Five-minute automatic test limit</small>

</div>

<div class="card">
  <h3>Live English translation</h3>
  <div id="transcript">Waiting for speech...</div>
</div>

<script>

const $ = id => document.getElementById(id);

const PRICE_PER_MINUTE = 0.034;
const MAX_SECONDS = 300;

let active = null;

function setStatus(message) {
  $("status").textContent = message;
}

async function startTranslation() {

  if (active) return;

  const token = $("token").value.trim();

  if (!token.startsWith("ek_")) {
    setStatus("Please enter a temporary ek_ token.");
    return;
  }

  const s = {
    pc: null,
    stream: null,
    context: null,
    timer: null,
    meter: null,
    started: null,
    abort: new AbortController()
  };

  active = s;

  $("start").disabled = true;
  $("stop").disabled = false;
  $("token").value = "";
  $("transcript").textContent = "";
  $("duration").textContent = "00:00";
  $("cost").textContent = "$0.00";

  try {

    setStatus("Connecting microphone...");

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: false,
          autoGainControl: true
        },
        video: false
      });

    if (active !== s) {
      stream.getTracks().forEach(t => t.stop());
      return;
    }

    s.stream = stream;

    const track = stream.getAudioTracks()[0];

    $("micName").textContent =
      "Microphone: " +
      (track.label || "System default");

    track.onended = () => {
      if (active === s) {
        stopTranslation("Microphone disconnected.");
      }
    };

    s.pc = new RTCPeerConnection();

    const pc = s.pc;

    pc.addTrack(track, stream);

    pc.ontrack = async event => {

      if (active !== s) return;

      $("audio").srcObject =
        event.streams[0] ||
        new MediaStream([event.track]);

      try {
        await $("audio").play();
      } catch {
        if (active === s) {
          $("play").hidden = false;
        }
      }
    };

    const events = pc.createDataChannel("oai-events");

    events.onmessage = event => {

      if (active !== s) return;

      let data;

      try {
        data = JSON.parse(event.data);
      } catch {
        return;
      }

      if (
        data.type === "session.output_transcript.delta"
      ) {

        $("transcript").textContent += data.delta;

        $("transcript").scrollTop =
          $("transcript").scrollHeight;
      }

      if (data.type === "error") {
        stopTranslation(
          data.error?.message || "OpenAI error"
        );
      }

      if (data.type === "session.closed") {
        stopTranslation("Translation session ended.");
      }
    };

    pc.onconnectionstatechange = () => {

      if (active !== s) return;

      if (pc.connectionState === "connected") {
        setStatus("Listening and translating live...");
      }

      if (pc.connectionState === "disconnected") {
        setStatus("Connection interrupted...");
      }

      if (
        pc.connectionState === "failed" ||
        pc.connectionState === "closed"
      ) {
        stopTranslation("Connection ended.");
      }
    };

    setStatus("Connecting to OpenAI...");

    const offer = await pc.createOffer();

    if (active !== s) return;

    await pc.setLocalDescription(offer);

    if (active !== s) return;

    s.started = Date.now();

    s.timer = setInterval(() => {

      const seconds = Math.floor(
        (Date.now() - s.started) / 1000
      );

      const minutes = Math.floor(seconds / 60);
      const remaining = seconds % 60;

      $("duration").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(remaining).padStart(2, "0");

      $("cost").textContent =
        "$" + (
          seconds / 60 * PRICE_PER_MINUTE
        ).toFixed(2);

      if (seconds >= MAX_SECONDS) {
        stopTranslation("Five-minute test completed.");
      }

    }, 500);

    const response = await fetch(
      "https://api.openai.com/v1/realtime/translations/calls",
      {
        method: "POST",
        headers: {
          Authorization: "Bearer " + token,
          "Content-Type": "application/sdp"
        },
        body: offer.sdp,
        signal: s.abort.signal
      }
    );

    if (!response.ok) {

      const message = await response.text();

      throw new Error(
        "OpenAI error " +
        response.status + ": " + message
      );
    }

    const answer = await response.text();

    if (active !== s) return;

    await pc.setRemoteDescription({
      type: "answer",
      sdp: answer
    });

    if (active !== s) return;

    startAudioMeter(s);

  } catch (error) {

    if (active === s) {
      stopTranslation(
        error.name + ": " + error.message
      );
    }
  }
}

async function startAudioMeter(s) {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    s.context = new AudioContextClass();

    await s.context.resume();

    if (active !== s) return;

    const source =
      s.context.createMediaStreamSource(s.stream);

    const analyser = s.context.createAnalyser();

    analyser.fftSize = 1024;

    source.connect(analyser);

    const samples =
      new Uint8Array(analyser.fftSize);

    s.meter = setInterval(() => {

      analyser.getByteTimeDomainData(samples);

      let sum = 0;

      for (const sample of samples) {
        sum += ((sample - 128) / 128) ** 2;
      }

      const rms =
        Math.sqrt(sum / samples.length);

      $("level").style.width =
        Math.min(100, rms * 400) + "%";

    }, 100);

  } catch {
    // Translation continues without the meter.
  }
}

async function enableAudio() {

  try {

    await $("audio").play();
    $("play").hidden = true;

  } catch (error) {

    setStatus("Audio error: " + error.message);

  }
}

function stopTranslation(
  message = "Translation stopped"
) {

  const s = active;

  active = null;

  if (s) {

    s.abort.abort();

    clearInterval(s.timer);
    clearInterval(s.meter);

    if (s.pc) {
      s.pc.close();
    }

    if (s.stream) {
      s.stream.getTracks().forEach(t => t.stop());
    }

    if (s.context) {
      s.context.close().catch(() => {});
    }
  }

  $("audio").pause();
  $("audio").srcObject = null;

  $("level").style.width = "0%";

  $("micName").textContent =
    "Microphone disconnected";

  $("start").disabled = false;
  $("stop").disabled = true;
  $("play").hidden = true;

  setStatus(message);
}

window.addEventListener("pagehide", () => {
  stopTranslation();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && active?.started) {
    stopTranslation("Stopped because the page was hidden.");
  }
});

</script>

</body>
</html>
